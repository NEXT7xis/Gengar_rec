          cat > app/src/main/java/com/gengar/rec/MainActivity.kt <<'EOF_11'
          package com.gengar.rec

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.view.ViewGroup.LayoutParams.MATCH_PARENT
          import android.view.ViewGroup.LayoutParams.WRAP_CONTENT
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              private val CARD = Color.parseColor("#0C0812")
              private val STROKE = Color.parseColor("#3B1F52")
              private val PURPLE = Color.parseColor("#9B4BC4")
              private val PINK = Color.parseColor("#D45FE0")
              private val CHIP = Color.parseColor("#1A1224")
              private val MUTED = Color.parseColor("#9A86A8")
              private val DEF = mapOf(
                  "res" to "540", "fps" to "60", "mbps" to "4",
                  "codec" to "h264", "audio" to "game", "delay" to "3"
              )
              private lateinit var sp: SharedPreferences
              private val refreshers = mutableListOf<() -> Unit>()

              private fun get(k: String) = sp.getString(k, DEF[k]) ?: DEF[k]!!
              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun refreshAll() = refreshers.forEach { it() }

              private fun shape(fill: Int, r: Int = 12, stroke: Int = 0) = GradientDrawable().apply {
                  setColor(fill)
                  cornerRadius = dp(r).toFloat()
                  if (stroke != 0) setStroke(dp(1), stroke)
              }

              private fun text(t: String, size: Float, color: Int, bold: Boolean = false) = TextView(this).apply {
                  text = t; textSize = size; setTextColor(color)
                  if (bold) typeface = Typeface.DEFAULT_BOLD
              }

              private fun card(root: LinearLayout, title: String): LinearLayout {
                  val c = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = shape(CARD, 16, STROKE)
                      setPadding(dp(14), dp(12), dp(14), dp(14))
                      layoutParams = LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply { topMargin = dp(12) }
                  }
                  c.addView(text(title, 11f, PINK, true).apply {
                      letterSpacing = 0.12f; setPadding(0, 0, 0, dp(8))
                  })
                  root.addView(c)
                  return c
              }

              private fun segmented(card: LinearLayout, key: String, labels: List<String>, values: List<String>) {
                  val row = LinearLayout(this)
                  val tvs = labels.mapIndexed { i, l ->
                      text(l, 13f, MUTED, true).apply {
                          gravity = Gravity.CENTER
                          setPadding(dp(2), dp(11), dp(2), dp(11))
                          layoutParams = LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f).apply { setMargins(dp(3), 0, dp(3), 0) }
                          setOnClickListener { sp.edit().putString(key, values[i]).apply(); refreshAll() }
                      }
                  }
                  tvs.forEach { row.addView(it) }
                  card.addView(row)
                  refreshers += {
                      tvs.forEachIndexed { i, t ->
                          val on = get(key) == values[i]
                          t.background = shape(if (on) PURPLE else CHIP, 10)
                          t.setTextColor(if (on) Color.WHITE else MUTED)
                      }
                  }
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  sp = getSharedPreferences("cfg", MODE_PRIVATE)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.BLACK)
                      setPadding(dp(18), dp(14), dp(18), dp(28))
                  }

                  // Cabeçalho
                  root.addView(ImageView(this).apply {
                      setImageResource(R.drawable.gengar_art)
                      adjustViewBounds = true
                      layoutParams = LinearLayout.LayoutParams(dp(200), WRAP_CONTENT).apply { gravity = Gravity.CENTER_HORIZONTAL }
                  })
                  root.addView(text("GENGAR REC", 24f, Color.WHITE, true).apply {
                      gravity = Gravity.CENTER; letterSpacing = 0.2f; setPadding(0, dp(4), 0, 0)
                  })
                  root.addView(text("ゲンガー  ·  gravador de tela leve", 13f, PINK).apply {
                      gravity = Gravity.CENTER; setPadding(0, dp(2), 0, dp(4))
                  })

                  // Presets
                  val pc = card(root, "PRESETS")
                  val prow = LinearLayout(this)
                  fun preset(name: String, vals: Map<String, String>) {
                      prow.addView(text(name, 13f, Color.WHITE, true).apply {
                          gravity = Gravity.CENTER
                          background = shape(CHIP, 10, PURPLE)
                          setPadding(0, dp(11), 0, dp(11))
                          layoutParams = LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f).apply { setMargins(dp(3), 0, dp(3), 0) }
                          setOnClickListener {
                              sp.edit().apply { vals.forEach { (k, v) -> putString(k, v) } }.apply()
                              refreshAll()
                          }
                      })
                  }
                  preset("Ultra leve", mapOf("res" to "480", "fps" to "30", "mbps" to "2", "codec" to "h264"))
                  preset("Leve 60fps", mapOf("res" to "540", "fps" to "60", "mbps" to "4", "codec" to "h264"))
                  preset("HD", mapOf("res" to "720", "fps" to "60", "mbps" to "6", "codec" to "h264"))
                  pc.addView(prow)

                  segmented(card(root, "RESOLUÇÃO"), "res", listOf("480p", "540p", "720p", "1080p"), listOf("480", "540", "720", "1080"))
                  segmented(card(root, "FPS"), "fps", listOf("24", "30", "45", "60"), listOf("24", "30", "45", "60"))
                  segmented(card(root, "BITRATE (Mbps)"), "mbps", listOf("2", "4", "6", "8", "12"), listOf("2", "4", "6", "8", "12"))
                  segmented(card(root, "CODEC"), "codec", listOf("H.264 (leve)", "H.265 (arquivo menor)"), listOf("h264", "hevc"))

                  val ac = card(root, "ÁUDIO")
                  segmented(ac, "audio", listOf("Sem", "Jogo", "Mic", "Jogo+Mic"), listOf("none", "game", "mic", "both"))
                  ac.addView(text("Jogo = som interno do celular. Se algum jogo bloquear e sair mudo, use Mic.", 11f, MUTED).apply {
                      setPadding(dp(4), dp(8), 0, 0)
                  })

                  segmented(card(root, "CONTAGEM ANTES DE GRAVAR"), "delay", listOf("0s", "3s", "5s", "10s"), listOf("0", "3", "5", "10"))

                  val info = text("", 13f, MUTED).apply { setPadding(0, dp(16), 0, dp(12)); gravity = Gravity.CENTER }
                  root.addView(info)
                  refreshers += {
                      val gbh = get("mbps").toInt() * 0.45
                      info.text = "${get("res")}p · ${get("fps")}fps · ${get("mbps")} Mbps  ≈  ${"%.1f".format(gbh)} GB por hora"
                  }

                  root.addView(text("●  GRAVAR", 20f, Color.WHITE, true).apply {
                      gravity = Gravity.CENTER
                      letterSpacing = 0.15f
                      background = GradientDrawable(
                          GradientDrawable.Orientation.LEFT_RIGHT,
                          intArrayOf(Color.parseColor("#7B3FC4"), Color.parseColor("#D45FE0"))
                      ).apply { cornerRadius = dp(18).toFloat() }
                      setPadding(0, dp(18), 0, dp(18))
                      setOnClickListener { onRecord() }
                  })
                  root.addView(text(
                      "Escolha \"Tela inteira\" ao iniciar. Para parar, use o botão PARAR da notificação. Vídeos em Filmes/GengarRec. Dica: adicione o botão \"Gengar Rec\" no painel de atalhos para gravar sem abrir o app.",
                      12f, MUTED
                  ).apply { gravity = Gravity.CENTER; setPadding(0, dp(12), 0, 0) })

                  setContentView(ScrollView(this).apply {
                      setBackgroundColor(Color.BLACK)
                      addView(root, MATCH_PARENT, WRAP_CONTENT)
                  })
                  refreshAll()
              }

              private fun onRecord() {
                  val need = mutableListOf<String>()
                  if (get("audio") != "none" && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED)
                      need += Manifest.permission.RECORD_AUDIO
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED)
                      need += Manifest.permission.POST_NOTIFICATIONS
                  if (need.isNotEmpty()) requestPermissions(need.toTypedArray(), 2) else launchCapture()
              }

              override fun onRequestPermissionsResult(rc: Int, p: Array<out String>, r: IntArray) {
                  super.onRequestPermissionsResult(rc, p, r)
                  if (rc == 2) {
                      if (get("audio") != "none" && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          sp.edit().putString("audio", "none").apply(); refreshAll()
                          Toast.makeText(this, "Sem permissão de áudio: gravando sem som", Toast.LENGTH_SHORT).show()
                      }
                      launchCapture()
                  }
              }

              private fun launchCapture() {
                  val mpm = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  @Suppress("DEPRECATION")
                  startActivityForResult(mpm.createScreenCaptureIntent(), 1)
              }

              @Suppress("DEPRECATION")
              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  if (req == 1 && res == RESULT_OK && data != null) {
                      startForegroundService(
                          Intent(this, RecorderService::class.java)
                              .setAction(RecorderService.ACTION_START)
                              .putExtra("code", res)
                              .putExtra("data", data)
                      )
                      moveTaskToBack(true)
                  }
              }
          }
